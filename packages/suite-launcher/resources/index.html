<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbletonOSC Suite Launcher</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <h1>AbletonOSC Suite Launcher</h1>
        <div class="header-info">
            <span id="local-ip">検出中...</span>
        </div>
        <div class="header-actions">
            <button id="btn-ableton-start" class="btn warning">Ableton Liveを起動</button>
            <button id="btn-all-start" class="btn primary">すべて起動</button>
            <button id="btn-all-stop" class="btn danger">すべて停止</button>
        </div>
    </header>

    <div id="service-warning" class="service-warning" hidden>
        <div id="service-warning-text"></div>
        <button id="btn-replace-stale" class="btn danger">古い処理を止めて入れ替える</button>
    </div>

    <main>
        <div id="apps-grid" class="grid">
            <!-- 動的生成されるアプリカード -->
        </div>
    </main>

    <!-- QRコードポップアップモーダル -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>iPad等での接続用 QRコード</h2>
            <p id="qr-url-text"></p>
            <div id="qr-code-img-container"></div>
        </div>
    </div>

    <!-- ログコンソール -->
    <footer>
        <div class="console-header" id="console-toggle">
            <span>コンソールログ</span>
            <span class="toggle-icon">▲</span>
        </div>
        <div class="console-body" id="console-logs"></div>
    </footer>

    <script src="js/neutralino.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
