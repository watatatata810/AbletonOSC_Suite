<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTC Sender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="status-waiting">
    <header id="topbar">
        <div id="mode-switch" role="group" aria-label="モード">
            <button id="mode-show" class="mode-btn" data-mode="show">本番</button>
            <button id="mode-rehearsal" class="mode-btn" data-mode="rehearsal">リハ</button>
        </div>
        <div id="connection">接続待ち</div>
        <label id="show-select-wrap">ショー
            <select id="show-select"></select>
        </label>
        <button id="new-show">新しいショー</button>
    </header>

    <section id="issues" aria-live="polite"></section>

    <main>
        <section id="now-playing">
            <div id="tc-label">出ている LTC</div>
            <div id="tc-display">--:--:--:--</div>
            <div id="now-scene">鳴っている台帳のシーンはありません</div>
        </section>

        <section id="seek-panel">
            <h2>途中から再生・飛ばす</h2>
            <div class="row">
                <label>シーン <select id="seek-scene"></select></label>
                <label>曲の頭から <input id="seek-time" type="text" placeholder="1:23.0" size="8" autocomplete="off"></label>
                <button id="seek-start">このシーンをここから再生</button>
            </div>
            <div class="row">
                <span>再生中:</span>
                <button class="jump-btn" data-delta="-10">-10 秒</button>
                <button class="jump-btn" data-delta="-5">-5 秒</button>
                <button class="jump-btn" data-delta="5">+5 秒</button>
                <button class="jump-btn" data-delta="10">+10 秒</button>
                <button id="jump-to">上の時刻へ飛ぶ</button>
            </div>
            <div id="seek-result"></div>
        </section>

        <section id="ledger">
            <h2>台帳</h2>
            <div id="show-settings" class="row wrap">
                <label>フレームレート <select id="set-rate"></select></label>
                <label>テンポ <input id="set-tempo" type="number" step="0.01" min="20" max="999"></label>
                <label>LTC レベル (dBFS) <input id="set-level" type="number" step="1" min="-40" max="0"></label>
                <label>LTC トラック <select id="set-ltc-track"></select></label>
                <label>BGM トラック <select id="set-bgm-track"></select></label>
                <label class="grow">LTC ファイルの出力先 <input id="set-output-dir" type="text" placeholder="C:\...\LTC"></label>
                <button id="save-settings">設定を保存</button>
            </div>
            <table id="cue-table">
                <thead>
                    <tr><th>シーン</th><th>BGM トラック</th><th>開始時刻</th><th>LTC ファイル</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="row">
                <label>追加するシーン <select id="add-scene"></select></label>
                <button id="add-cue">台帳に追加</button>
                <button id="auto-assign">開始時刻を 01:00:00 から 1 時間ずつ振る</button>
            </div>
            <p class="hint">LTC ファイルを作ったら、Live の LTC トラックの同じシーンにドラッグし、Warp オン・Re-Pitch・クリップの BPM を Live のテンポと同じにしてください。</p>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
