<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>台本ポン出しトリガー</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- ナビゲーションサイドバー -->
        <div id="sidebar" class="sidebar-hidden">
            <div id="sidebar-header">
                <h3>Pages</h3>
                <button id="btn-close-sidebar" class="icon-btn">×</button>
            </div>
            <div id="thumbnail-container"></div>
        </div>

        <!-- 上部ヘッダーコントロール -->
        <header id="controls">
            <div style="display: flex; gap: 5px;">
                <button id="btn-upload-pdf" class="nav-btn">PDF変更</button>
                <button id="btn-export-pdf" class="nav-btn" style="background-color: #ff9500;">PDF書出</button>
                <input type="file" id="pdf-upload-input" accept="application/pdf" class="hidden">
            </div>
            <button id="btn-toggle-sidebar" class="nav-btn">≡ 目次</button>
            <div id="page-info">
                Page: <input type="number" id="current-page-input" value="1" min="1" max="999"> / <span id="page-count">--</span>
            </div>
            <div id="zoom-controls">
                <span>Zoom: <span id="zoom-level">100%</span></span>
            </div>
            <div>
                <button id="mode-view" class="nav-btn">LIVE</button>
                <button id="mode-select" class="nav-btn active">選択</button>
                <button id="mode-trigger" class="nav-btn">トリガー</button>
                <button id="mode-draw" class="nav-btn">ペン</button>
                <button id="mode-eraser" class="nav-btn">消しゴム</button>
            </div>
            <div>
                <button id="btn-undo" class="nav-btn" title="元に戻す" style="display: flex; align-items: center; justify-content: center; padding: 4px 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 14 4 9l5-5"/>
                        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ペン設定パネル (サブヘッダー領域として独立) -->
        <div id="pen-settings" class="pen-settings-hidden">
            <div class="color-btn" data-color="rgba(0,0,0,0.7)" style="background-color: black;"></div>
            <div class="color-btn" data-color="rgba(255,0,0,0.7)" style="background-color: red;"></div>
            <div class="color-btn" data-color="rgba(0,255,0,0.7)" style="background-color: #34c759;"></div>
            <div class="color-btn" data-color="rgba(0,122,255,0.7)" style="background-color: #007aff;"></div>
            <div class="color-btn" data-color="rgba(255,204,0,0.7)" style="background-color: #ffcc00;"></div>
            
            <span style="margin-left: 15px;">太さ:</span>
            <input type="number" id="pen-width-input" value="3" min="0.5" max="50" step="0.5" style="width: 60px;">
            <button class="nav-btn pen-width-btn" data-width="0.5" style="padding: 4px 8px;">極細</button>
            <button class="nav-btn pen-width-btn" data-width="2" style="padding: 4px 8px;">細</button>
            <button class="nav-btn pen-width-btn" data-width="5" style="padding: 4px 8px;">中</button>
            <button class="nav-btn pen-width-btn" data-width="10" style="padding: 4px 8px;">太</button>
        </div>

        <!-- トリガー設定パネル (サブヘッダー領域として独立) -->
        <div id="trigger-settings" class="pen-settings-hidden" style="display: flex; align-items: center; justify-content: flex-end; gap: 15px; background-color: #2c2c2e; padding: 8px 15px; border-bottom: 1px solid #444; max-height: 50px; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease; z-index: 9;">
            <label style="color: white; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="continuous-trigger-mode" style="width: 18px; height: 18px; cursor: pointer;">
                連続配置モード
            </label>
            <div id="continuous-status-container" style="display: none; align-items: center; gap: 10px;">
                <span id="continuous-next-text" style="color: #34c759; font-weight: bold;">次の配置: 未定</span>
                <button id="btn-reset-continuous" class="nav-btn" style="padding: 4px 8px; font-size: 12px; background-color: #555;">リセット</button>
            </div>
        </div>

        <!-- メインキャンバスエリア -->
        <main id="canvas-container">
            <!-- ピンチズームで全体を拡大縮小するためのラッパー -->
            <div id="zoom-wrapper">
                <!-- ここに app.js から各ページのコンテナが動的に生成されます -->
            </div>
        </main>
    </div>

    <!-- コンテキストメニュー (初期非表示) -->
    <div id="context-menu" class="hidden">
        <button id="btn-ctx-copy" class="ctx-btn">コピー</button>
        <button id="btn-ctx-paste" class="ctx-btn" style="display: none;">ペースト</button>
        <button id="btn-ctx-delete" class="ctx-btn text-danger">削除</button>
    </div>

    <!-- トリガー設定モーダル (初期非表示) -->
    <div id="trigger-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content-large">
            <div class="modal-header">
                <h2>Live セッションビューから選択</h2>
                <button id="modal-refresh" class="btn-primary">
                    Liveから再取得
                </button>
            </div>
            
            <!-- 構成変更アラート -->
            <div id="modal-warning" class="hidden" style="background-color: #ff3b30; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 14px; font-weight: bold;">⚠️ Ableton側の曲構成の変更を検知しました！</span>
                <button id="btn-update-session" class="nav-btn" style="background-color: white; color: #ff3b30; padding: 4px 10px; font-size: 12px;">最新に更新</button>
            </div>

            <!-- ローディング表示 -->
            <div id="modal-loading" class="modal-loading">
                <div class="spinner"></div>
                <p>Ableton Live からセッション情報を取得中...</p>
            </div>
            
            <!-- グリッド表示コンテナ -->
            <div id="modal-grid-container" class="grid-container hidden">
                <table id="session-grid">
                    <thead id="session-grid-head"></thead>
                    <tbody id="session-grid-body"></tbody>
                </table>
            </div>

            <!-- アクションボタン -->
            <div class="modal-footer">
                <button id="modal-cancel" class="btn-secondary">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <!-- 外部ライブラリ (ローカルファイル) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="lib/pdf.min.js"></script>
    <script src="lib/fabric.min.js"></script>
    <script>
        // PDF.jsのワーカーパスを設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    </script>

    <!-- メインロジック -->
    <script src="app.js"></script>
</body>
</html>
