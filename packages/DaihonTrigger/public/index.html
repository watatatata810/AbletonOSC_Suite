<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台本ポン出しトリガー</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- ナビゲーションサイドバー -->
        <div id="sidebar" class="sidebar-hidden">
            <div id="sidebar-header">
                <h3>Pages</h3>
                <button id="btn-close-sidebar" class="icon-btn">×</button>
            </div>
            <div id="thumbnail-container"></div>
        </div>

        <!-- 上部ヘッダーコントロール -->
        <header id="controls">
            <button id="btn-toggle-sidebar" class="nav-btn">≡ 目次</button>
            <div id="page-info">
                Page: <input type="number" id="current-page-input" value="1" min="1" max="999"> / <span id="page-count">--</span>
            </div>
            <div id="zoom-controls">
                <span>Zoom: <span id="zoom-level">100%</span></span>
            </div>
            <div>
                <button id="mode-view" class="nav-btn active">閲覧</button>
                <button id="mode-trigger" class="nav-btn">トリガー</button>
                <button id="mode-draw" class="nav-btn">ペン</button>
                <button id="mode-eraser" class="nav-btn">消しゴム</button>
            </div>
            <div>
                <button id="btn-undo" class="nav-btn">元に戻す</button>
                <button id="btn-export-pdf" class="nav-btn" style="background-color: #ff9500;">PDF書出</button>
                <button id="btn-upload-pdf" class="nav-btn">PDF変更</button>
                <input type="file" id="pdf-upload-input" accept="application/pdf" class="hidden">
            </div>
        </header>

        <!-- ペン設定パネル (サブヘッダー領域として独立) -->
        <div id="pen-settings" class="pen-settings-hidden">
            <div class="color-btn" data-color="rgba(0,0,0,0.7)" style="background-color: black;"></div>
            <div class="color-btn" data-color="rgba(255,0,0,0.7)" style="background-color: red;"></div>
            <div class="color-btn" data-color="rgba(0,255,0,0.7)" style="background-color: #34c759;"></div>
            <div class="color-btn" data-color="rgba(0,122,255,0.7)" style="background-color: #007aff;"></div>
            <div class="color-btn" data-color="rgba(255,204,0,0.7)" style="background-color: #ffcc00;"></div>
            
            <span style="margin-left: 15px;">太さ:</span>
            <input type="number" id="pen-width-input" value="3" min="0.5" max="50" step="0.5" style="width: 60px;">
            <button class="nav-btn pen-width-btn" data-width="0.5" style="padding: 4px 8px;">極細</button>
            <button class="nav-btn pen-width-btn" data-width="2" style="padding: 4px 8px;">細</button>
            <button class="nav-btn pen-width-btn" data-width="5" style="padding: 4px 8px;">中</button>
            <button class="nav-btn pen-width-btn" data-width="10" style="padding: 4px 8px;">太</button>
        </div>

        <!-- メインキャンバスエリア -->
        <main id="canvas-container">
            <!-- ピンチズームで全体を拡大縮小するためのラッパー -->
            <div id="zoom-wrapper">
                <!-- ここに app.js から各ページのコンテナが動的に生成されます -->
            </div>
        </main>
    </div>

    <!-- トリガー設定モーダル (初期非表示) -->
    <div id="trigger-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content-large">
            <div class="modal-header">
                <h2>Live セッションビューから選択</h2>
                <button id="modal-refresh" class="btn-primary">
                    Liveから再取得
                </button>
            </div>
            
            <!-- ローディング表示 -->
            <div id="modal-loading" class="modal-loading">
                <div class="spinner"></div>
                <p>Ableton Live からセッション情報を取得中...</p>
            </div>
            
            <!-- グリッド表示コンテナ -->
            <div id="modal-grid-container" class="grid-container hidden">
                <table id="session-grid">
                    <thead id="session-grid-head"></thead>
                    <tbody id="session-grid-body"></tbody>
                </table>
            </div>

            <!-- アクションボタン -->
            <div class="modal-footer">
                <button id="modal-cancel" class="btn-secondary">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <!-- 外部ライブラリ (ローカルファイル) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="lib/pdf.min.js"></script>
    <script src="lib/fabric.min.js"></script>
    <script>
        // PDF.jsのワーカーパスを設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    </script>

    <!-- メインロジック -->
    <script src="app.js"></script>
</body>
</html>
